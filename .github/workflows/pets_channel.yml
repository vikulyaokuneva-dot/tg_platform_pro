name: PETS channel (manual dry-run)

on:
  workflow_dispatch:
    inputs:
      include_demo_briefs:
        description: "Prepare the three bundled demonstration drafts (never sends Telegram)"
        required: true
        default: false
        type: boolean
      controlled_publish:
        description: "One owner-approved PETS publication (requires durable state and PETS_PUBLISH=1)"
        required: true
        default: false
        type: boolean
      use_external_sources:
        description: "Use official PETS source adapters (still dry-run; requires owner opt-in)"
        required: true
        default: false
        type: boolean
      use_live_gigachat:
        description: "Use paid GigaChat only after explicit owner approval (never publishes Telegram)"
        required: true
        default: false
        type: boolean
      gigachat_generation_limit:
        description: "Hard cap for paid GigaChat requests (1–10; 0 blocks the calls)"
        required: true
        default: 0
        type: number
      collect_source_candidates:
        description: "Collect up to 10 real source candidates; no AI, no Telegram"
        required: true
        default: false
        type: boolean

# Intended future schedule: 12:00 Moscow = 09:00 UTC -> "0 9 * * *".
# It is intentionally not enabled until the owner approves sources, bot, durable
# state storage and one controlled publication.
concurrency:
  group: pets-channel
  cancel-in-progress: false

permissions:
  # PETS only: optional durable backend writes state to the isolated
  # pets-state branch. Other workflows retain their existing permissions.
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cache is observed only for dry-run continuity. It is not an approved
      # production source of truth; pets.py refuses real publishing with it.
      - name: Restore PETS dry-run state
        id: pets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pets_channel.db
            jobs/pets/storage.json
          key: pets-state-${{ github.run_id }}
          restore-keys: pets-state-
      - run: pip install -r requirements.txt
      - name: Run PETS in forced dry-run mode
        run: python -m jobs.pets.run
        env:
          # This checkbox is only one of three gates: it also needs the
          # repository variable PETS_PUBLISH=1 and a durable state backend.
          DRY_RUN: ${{ inputs.controlled_publish && '0' || '1' }}
          # A repository variable remains 0 until the owner has completed the
          # controlled-release checklist. DRY_RUN above is an independent gate.
          PETS_PUBLISH: ${{ vars.PETS_PUBLISH }}
          # One management bot for all platform channels. PETS has its own
          # target chat and state; it never receives a separate bot token.
          AI_AUTOMATION_BOT_TOKEN: ${{ secrets.AI_AUTOMATION_BOT_TOKEN }}
          PETS_CHAT_ID: ${{ secrets.PETS_CHAT_ID }}
          PETS_SOURCES: ${{ vars.PETS_SOURCES }}
          PETS_PUBLISH_LIMIT: ${{ vars.PETS_PUBLISH_LIMIT }}
          PETS_MAX_PER_RUN: ${{ vars.PETS_MAX_PER_RUN }}
          PETS_EDITORIAL_PROFILE: pets_expert
          PETS_CONTENT_MODE: evergreen
          PETS_DEMO_BRIEFS: ${{ inputs.include_demo_briefs && '1' || '0' }}
          PETS_EXTERNAL_SOURCES: ${{ inputs.use_external_sources && '1' || '0' }}
          PETS_GENERATOR_MODE: ${{ inputs.use_live_gigachat && 'gigachat' || 'mock' }}
          PETS_ALLOW_LIVE_AI: ${{ inputs.use_live_gigachat && '1' || '0' }}
          PETS_MAX_GIGACHAT_GENERATIONS: ${{ inputs.gigachat_generation_limit }}
          # The secret is only usable when the opt-in checkbox above is set;
          # the job never prints it or writes it to an artifact.
          GIGACHAT_API_KEY: ${{ inputs.use_live_gigachat && secrets.GIGACHAT_API_KEY || '' }}
          PETS_STATE_BACKEND: ${{ vars.PETS_STATE_BACKEND }}
          PETS_STATE_REPOSITORY: ${{ vars.PETS_STATE_REPOSITORY }}
          PETS_STATE_BRANCH: ${{ vars.PETS_STATE_BRANCH }}
          PETS_STATE_PATH: ${{ vars.PETS_STATE_PATH }}
          PETS_STATE_GITHUB_TOKEN: ${{ github.token }}
      - name: Collect PETS source candidates (no AI, no Telegram)
        if: ${{ inputs.collect_source_candidates }}
        run: python -m jobs.pets.source_candidates
        env:
          PETS_PUBLISH: '0'
          PETS_SOURCE_CANDIDATE_LIMIT: '10'
      - name: Save PETS dry-run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/pets_channel.db
            jobs/pets/storage.json
          key: pets-state-${{ github.run_id }}
      - name: Upload PETS dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pets-dry-run-${{ github.run_id }}
          path: |
            runs/pets_preview.md
            runs/pets_media
            runs/pets_diagnostics.json
            runs/pets_sources_report.json
            runs/pets_license_report.json
            runs/pets_source_candidates.json
            runs/pets_source_candidates_diagnostics.json
            jobs/pets/storage.json
          retention-days: 14
