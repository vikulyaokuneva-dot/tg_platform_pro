name: Daily jobs

on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 МСК (UTC+3)
    - cron: "0 18 * * *"   # 21:00 МСК (UTC+3)

  # Ручной запуск из GitHub → Actions → Daily jobs → Run workflow
  workflow_dispatch:

# Единая очередь с case_pipeline.yml (тот же канал и та же БД history):
# общий concurrency group сериализует daily- и manual-dispatch, чтобы
# параллельные прогоны не перезаписали свежий снапшот кэша устаревшим.
concurrency:
  group: case-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Персистентность publication history между запусками — та же схема,
      # что в case_pipeline.yml: общий restore-префикс case-db-* (кэш
      # репозитория, не workflow) => daily получает последний снапшот,
      # сохранённый ЛЮБЫМ из двух workflow; save-ключ уникален по run_id.
      # actions/cache эвиктится после ~7 дней неактивности; два запуска в
      # сутки держат кэш живым (и для case_pipeline.yml тоже).
      # restore/save РАЗДЕЛЕНЫ: единый actions/cache@v4 объявляет
      # post-if: success() — при падении шага запуска журнал публикаций не
      # сохранялся бы и следующий run восстановил бы состояние ДО публикации
      # (риск повторной отправки в Telegram). Отдельный save-шаг с
      # if: always() фиксирует data/ в любом исходе job.
      - name: Restore pipeline DB
        uses: actions/cache/restore@v4
        with:
          path: data
          key: case-db-${{ github.run_id }}
          restore-keys: case-db-

      - run: pip install -r requirements.txt

      - run: python runner.py
        env:
          CASE_PUBLISH: "1"   # публикация разрешена (job гейт: CASE_PUBLISH=1 и DRY_RUN!=1)
          AGRO_PUBLISH: "1"   # разрешение на реальную отправку для agro-канала
          AGRO_BOT_TOKEN: ${{ secrets.AI_AUTOMATION_BOT_TOKEN }}
          AGRO_CHAT_ID: ${{ secrets.AGRO_CHAT_ID }}
          AI_AUTOMATION_BOT_TOKEN: ${{ secrets.AI_AUTOMATION_BOT_TOKEN }}
          AI_AUTOMATION_CHAT_ID: ${{ secrets.AI_AUTOMATION_CHAT_ID }}
          # ИИ-редактура agro: секрет GIGACHAT_API_KEY есть в репозитории, но
          # job его не видит без явного env-mapping — CI падал в extractive-
          # фолбэк (дефект msg80/81: summary ai_skipped=1 при ai_edited=0,
          # пост = только вступление без рекомендаций)
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}

      # Save выполняется всегда (в т.ч. при падении runner.py): журнал
      # публикаций, записанный до падения, обязан пережить прогон — иначе
      # следующий run восстановит кэш ДО публикации и повторит отправку.
      # Ключ с тем же префиксом и уникален по run_id (как у restore).
      - name: Save pipeline DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: case-db-${{ github.run_id }}
