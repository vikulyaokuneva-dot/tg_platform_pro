name: Daily jobs
on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 МСК (UTC+3)
    - cron: "0 18 * * *"    # 21:00 МСК (UTC+3)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python runner.py
        env:
          CASE_PUBLISH: "1"   # публикация разрешена (job гейт: CASE_PUBLISH=1 и DRY_RUN!=1)
          AI_AUTOMATION_BOT_TOKEN: ${{ secrets.AI_AUTOMATION_BOT_TOKEN }}
