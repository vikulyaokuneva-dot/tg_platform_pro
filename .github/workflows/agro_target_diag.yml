# TEMPORARY: read-only диагностика agro-target (инцидент «400 chat not found»
# от 2026-10-08). Запускается вручную (Run workflow), пайплайн НЕ запускается,
# публикаций НЕТ, кэш НЕ сохраняется обратно (только restore) => состояние
# CI-БД не меняется. Печатает: факты AGRO_CHAT_ID, getMe токена (id/username),
# getChat/getChatMember чата — без вывода токена (см. diag_agro_target.py).
# Удалить после разбора инцидента.
name: Agro target diag (temporary)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # read-only: тот же префикс case-db- (видим актуальное состояние CI-БД),
      # save-шага нет => ничего не пишется обратно
      - name: Restore pipeline DB (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: case-db-${{ github.run_id }}
          restore-keys: case-db-

      - run: pip install -r requirements.txt

      - name: Diagnose agro target
        run: python diag_agro_target.py
        env:
          AGRO_BOT_TOKEN: ${{ secrets.AI_AUTOMATION_BOT_TOKEN }}
          AGRO_CHAT_ID: ${{ secrets.AGRO_CHAT_ID }}
