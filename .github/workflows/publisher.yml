name: TG Autopublisher

on:
  schedule:
    # 09:00 / 13:00 / 18:00 MSK (UTC+3) == 06:00 / 10:00 / 15:00 UTC
    - cron: "0 6,10,15 * * *"
  workflow_dispatch:

concurrency:
  group: tg-autopublisher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/bot.db
          key: botdb-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            botdb-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publisher
        env:
          POSTER_BOT_TOKEN: ${{ secrets.POSTER_BOT_TOKEN }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}

          AI_AUTOMATION_CHAT_ID: ${{ secrets.AI_AUTOMATION_CHAT_ID }}
          ANEKDOTY_CHAT_ID: ${{ secrets.ANEKDOTY_CHAT_ID }}
          CRYPTO_AIRDROPS_CHAT_ID: ${{ secrets.CRYPTO_AIRDROPS_CHAT_ID }}
          CRYPTO_NEWS_CHAT_ID: ${{ secrets.CRYPTO_NEWS_CHAT_ID }}
          IT_HUMOR_CHAT_ID: ${{ secrets.IT_HUMOR_CHAT_ID }}
          PERSONAL_FINANCE_CHAT_ID: ${{ secrets.PERSONAL_FINANCE_CHAT_ID }}
          PRODUCT_GROWTH_CHAT_ID: ${{ secrets.PRODUCT_GROWTH_CHAT_ID }}
          PROGRAMMING_DEV_CHAT_ID: ${{ secrets.PROGRAMMING_DEV_CHAT_ID }}
          STARTUPS_VC_CHAT_ID: ${{ secrets.STARTUPS_VC_CHAT_ID }}
          STOCKS_INVESTING_CHAT_ID: ${{ secrets.STOCKS_INVESTING_CHAT_ID }}

        run: |
          mkdir -p data
          python run_once.py
