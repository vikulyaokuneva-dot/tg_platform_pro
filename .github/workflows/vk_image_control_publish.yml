name: VK licensed image control post

on:
  workflow_dispatch:
    inputs:
      material_id:
        description: "Verified queue material to preview or publish"
        required: true
        default: "104"
        type: string
      mode:
        description: "preview only validates; publish needs the confirmation phrase"
        required: true
        default: preview
        type: choice
        options: [preview, publish]
      confirm:
        description: "For publish enter PUBLISH_ONE_LICENSED_VK_IMAGE exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: vk-image-control-post
  cancel-in-progress: false

jobs:
  control-post:
    runs-on: ubuntu-latest
    env:
      VK_GROUP_ID: ${{ vars.VK_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Preview one committed licensed-image material
        run: >-
          python -m case_pipeline.vk_daily_autopilot preview --verify-media
          --state vk_daily/queue.json --root . --material-id "${{ inputs.material_id }}"

      - name: Require explicit publication confirmation
        if: inputs.mode == 'publish'
        run: test "${{ inputs.confirm }}" = "PUBLISH_ONE_LICENSED_VK_IMAGE"

      - name: Persist the one pre-publication claim
        if: inputs.mode == 'publish' && inputs.confirm == 'PUBLISH_ONE_LICENSED_VK_IMAGE'
        run: |
          python -m case_pipeline.vk_daily_autopilot claim --state vk_daily/queue.json --root . --material-id "${{ inputs.material_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_daily/queue.json
          git commit -m "Claim licensed VK image control post"
          git push origin HEAD:main

      - name: Publish the claimed material with its approved image
        if: inputs.mode == 'publish' && inputs.confirm == 'PUBLISH_ONE_LICENSED_VK_IMAGE'
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_PUBLISH: '1'
        run: python -m case_pipeline.vk_daily_autopilot publish --state vk_daily/queue.json --root .

      - name: Persist the final control-post result
        if: always() && inputs.mode == 'publish' && inputs.confirm == 'PUBLISH_ONE_LICENSED_VK_IMAGE'
        run: |
          if git diff --quiet -- vk_daily/queue.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_daily/queue.json
          git commit -m "Record licensed VK image control post result"
          git push origin HEAD:main
